
[package]
name = "efs-proxy"
edition = "2021"
# The version of efs-proxy is tied to efs-utils.
version = "3.3.5"
publish = false
license = "MIT"

[features]
# Each feature forwards to the efs-client-core feature of the same name.
# `--no-default-features` builds a mount-target proxy without the AWS SDK.
default = ["read-bypass", "cloudwatch"]
# Direct S3 reads. Without it, read_bypass_requested is treated as no.
read-bypass = [
    "cloudwatch",
    "amzn-efs-client-core/read-bypass",
    "dep:aws-sdk-s3",
    "dep:lru",
    "dep:moka",
    "dep:sysinfo",
]
# CloudWatch metrics and logs publisher.
cloudwatch = [
    "amzn-efs-client-core/cloudwatch",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-cloudwatch",
    "dep:aws-sdk-cloudwatchlogs",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-types",
]

[dependencies]
# Shared client-core library. efs-proxy re-exports its modules under their
# original crate paths (crate::aws, crate::config, crate::config_parser,
# crate::proxy_identifier, crate::utils, crate::error, crate::awsfile_prot,
# and the moved crate::util submodules) so existing references compile unchanged.
amzn-efs-client-core = { path = "../client-core", default-features = false }
anyhow = "1.0.72"
zeroize = "1"
atomic_enum = "0.2"
async-trait = "0.1"
# efs-proxy code reaches the AWS SDK and the readahead caches only through
# efs-client-core. The crates below stay declared, optional under the features,
# so the resolved dependency graph, and with it the committed Cargo.lock of the
# efs-utils release build, does not depend on the feature split.
aws-config = { version = "1.6.3", optional = true }
aws-credential-types = { version = "1.2.3", optional = true }
# The AWS SDK crates are taken without default features so that the deprecated
# `rustls` alias stays off. That alias resolves to
# aws-smithy-runtime/tls-rustls, which pulls the ring-based rustls 0.21 over
# hyper 0.14 alongside the modern stack. `default-https-client` already selects
# rustls-aws-lc (rustls 0.23 + aws-lc), and the TLS provider is chosen
# explicitly on the aws-smithy-http-client builder, so every other default
# feature is kept and only the legacy alias is dropped.
aws-sdk-s3 = { version = "1.87.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"], optional = true }
aws-sdk-cloudwatch = { version = "1.64.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-cloudwatchlogs = { version = "1.64.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-smithy-http-client = { version = "1.1.9", features = ["default-client", "rustls-aws-lc", "rustls-aws-lc-fips"], optional = true }
aws-smithy-types = { version = "1.3", optional = true }
bytes = { version = "1.11.1" }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dashmap = "6.0.1"
dyn-clone = "1.0"
futures = "0.3"
log = "0.4"
libc = "0.2"
log4rs = { version = "1.2.0", features = ["rolling_file_appender", "compound_policy", "size_trigger", "fixed_window_roller"]}
lru = { version = "0.18", optional = true }
moka = { version = "0.12.10", features = ["sync"], optional = true }
nix = { version = "0.26.2", features = ["signal"]}
onc-rpc = "0.3.3"
rand = "0.8"
regex = "1.10.2"
s2n-tls = {version="^0.3.19",features=["fips"]}
s2n-tls-tokio = "^0.3.19"
socket2 = { version = "0.6", features = ["all"] }
serde = {version="1.0.175",features=["derive"]}
serde_ini = "0.2.0"
static_assertions = "1.1.0"
strum_macros = "0.27.1"
sysinfo = { version = "0.33", optional = true }
thiserror = "1.0.44"
# Below 1.54.0 because tokio 1.54.0 is flagged as an availability risk.
tokio = { version = ">=1.40.0, <1.54.0", features = ["full"] }
tokio-util = "0.7.8"
uuid = { version = "1.4.1", features = ["v4", "fast-rng", "macro-diagnostics"]}
# XDR runtime + shared NFSv4.1 wire bindings. xdr_codec keeps its lib name so
# `use xdr_codec` is unchanged; the nfs bindings are re-exported under crate::nfs.
xdr_codec = { package = "amzn-xdr-codec", path = "../nfs-xdr-bindings/rust-xdr/xdr-codec" }
amzn-nfs-xdr-bindings = { path = "../nfs-xdr-bindings" }

[target.'cfg(not(target_env = "musl"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
# efs-proxy tests reuse the client-core test-only constructors (S3Client::default,
# ReadBypassContext::default, set_s3_client_enabled), gated behind the
# `test-util` feature.
amzn-efs-client-core = { path = "../client-core", default-features = false, features = ["test-util"] }
mockall = "0.11.3"
test-case = "*"
tokio = { version = "1.29.0", features = ["test-util"] }
tempfile = "3.10.1"
hex-literal = "1.0.0"
aws-smithy-mocks = "0.1.1"
aws-sdk-s3 = { version = "1.87.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio", "test-util"] }
aws-smithy-runtime-api = "1.8.0"
serial_test = "3.0"

# The Shuttle bans in the workspace's clippy.toml apply to efs-client-core, which is
# onboarded to Shuttle. This crate reaches std's primitives directly, so the lints
# that enforce that convention are off here.
[lints.clippy]
disallowed_types = "allow"
disallowed_methods = "allow"
