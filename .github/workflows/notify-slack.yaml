name: Slack Notifications

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Untrusted GitHub event fields (titles, bodies, logins) are passed via env
      # and encoded into JSON with `jq --arg`, never interpolated into the payload
      # string directly: a `jq` encoder quotes them safely, so a crafted title or
      # comment cannot break out of the JSON or inject keys into the webhook body.
      - name: Build issue notification payload
        if: github.event_name == 'issues'
        env:
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          USER: ${{ github.event.issue.user.login }}
        run: |
          jq -n \
            --arg type "issue_update" \
            --arg action "$ACTION" \
            --argjson number "$NUMBER" \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg user "$USER" \
            '{type: $type, action: $action, number: $number, title: $title, url: $url, user: $user}' \
            > "${RUNNER_TEMP}/slack-payload.json"

      - name: Send issue notification to Slack
        if: github.event_name == 'issues'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json

      - name: Build pull request notification payload
        if: github.event_name == 'pull_request_target'
        env:
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          USER: ${{ github.event.pull_request.user.login }}
        run: |
          jq -n \
            --arg type "pr_update" \
            --arg action "$ACTION" \
            --argjson number "$NUMBER" \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg user "$USER" \
            '{type: $type, action: $action, number: $number, title: $title, url: $url, user: $user}' \
            > "${RUNNER_TEMP}/slack-payload.json"

      - name: Send pull request notification to Slack
        if: github.event_name == 'pull_request_target'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json

      - name: Build issue comment notification payload
        if: github.event_name == 'issue_comment' && !github.event.issue.pull_request
        env:
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.comment.html_url }}
          BODY: ${{ github.event.comment.body }}
          USER: ${{ github.event.comment.user.login }}
        run: |
          jq -n \
            --arg type "issue_comment" \
            --arg action "$ACTION" \
            --argjson number "$NUMBER" \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg body "$BODY" \
            --arg user "$USER" \
            '{type: $type, action: $action, number: $number, title: $title, url: $url, body: $body, user: $user}' \
            > "${RUNNER_TEMP}/slack-payload.json"

      - name: Send issue comments notification to Slack
        if: github.event_name == 'issue_comment' && !github.event.issue.pull_request
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
